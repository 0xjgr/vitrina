# La escribe scripts/desde_issue.py --plantilla: no se toca a mano.
name: "Editar pieza"
description: "Cambia la nota, el estado, la fecha o la opinión de una pieza. Se abre desde el botón Editar de cada ficha."
title: "Editar pieza"
labels: ["editar-pieza"]
body:
  - type: input
    id: ficha
    attributes:
      label: "Ficha"
      description: "La pone el botón Editar de la web: carpeta y nombre del fichero, sin .md."
    validations:
      required: true
  - type: input
    id: nota
    attributes:
      label: "Nota"
      description: "Del 1 al 10. En blanco, se queda como está; 0 la quita."
  - type: dropdown
    id: estado
    attributes:
      label: "Estado"
      options: ["Sin cambios", "terminado", "en curso", "pendiente", "abandonado"]
      default: 0
  - type: input
    id: terminada
    attributes:
      label: "Cuándo la terminaste"
      description: "AAAA, AAAA-MM o AAAA-MM-DD. Lo que haya aquí sustituye a la fecha; en blanco, se queda como está."
  - type: input
    id: via
    attributes:
      label: "Me llegó por"
      description: "Quién te la recomendó o de dónde salió, separados por comas. Sustituye a lo que tenga; en blanco, se queda como está; - lo quita."
  - type: textarea
    id: frase
    attributes:
      label: "Por qué está en la vitrina"
      description: "Tu opinión. Lo que haya aquí sustituye a la que tiene; en blanco, se queda como está."
  - type: checkboxes
    id: quitar
    attributes:
      label: "Quitar la opinión"
      options:
        - label: "Borrar la opinión que tiene"
